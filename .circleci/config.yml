version: 2.1

orbs:
  node: circleci/node@7.1.0

jobs:
  # ── Test ──────────────────────────────────
  test:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run tests
          command: npm test -- --watch=false

  # ── Build & Deploy to EC2 ─────────────────
  build-and-deploy:
    docker:
      - image: cimg/base:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:cJ1W+1/OBU6rnqDS0vp3SCQz2Z1APBroMXuEFRCNlCk"

      - run:
          name: Deploy to AWS EC2
          command: |
            echo "Conectando a ${EC2_USER}@${EC2_IP} ..."
            ssh -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_IP}" "
              set -e
              echo 'Cambiando al directorio del proyecto...'
              cd ~/workflow_view

              echo 'Obtenendo ultimos cambios...'
              git pull origin main

              echo 'Reconstruyendo y reiniciando contenedores...'
              docker compose down
              docker compose up -d --build

              echo 'Deploy completado exitosamente!'
            "

workflows:
  build-and-deploy:
    jobs:
      - test
      - build-and-deploy:
          requires:
            - test
          filters:
            branches:
              only: main
